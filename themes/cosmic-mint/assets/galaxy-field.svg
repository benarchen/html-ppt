<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="band-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d73c9" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#6674cf" stop-opacity="0.2"/>
      <stop offset="0.52" stop-color="#8a7ed8" stop-opacity="0.32"/>
      <stop offset="0.72" stop-color="#5d9fc5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5d9fc5" stop-opacity="0"/>
    </linearGradient>
    <filter id="cloud" x="-20%" y="-80%" width="140%" height="260%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.07" numOctaves="4" seed="23" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0.72 0 0 0 0.12
        0 0.78 0 0 0.16
        0 0 1 0 0.24
        0 0 0 0.62 -0.2" result="tinted"/>
      <feComposite in="tinted" in2="SourceGraphic" operator="in" result="masked"/>
      <feGaussianBlur in="masked" stdDeviation="5.5"/>
    </filter>
    <filter id="star-glow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="rotate(-28 640 360)">
    <rect x="-180" y="284" width="1640" height="170" rx="85" fill="url(#band-fade)" filter="url(#cloud)"/>
    <g fill="#a6b9e8" fill-opacity="0.18">
      <circle cx="55" cy="345" r="1.3"/><circle cx="93" cy="369" r="0.8"/><circle cx="132" cy="324" r="1.1"/>
      <circle cx="171" cy="391" r="1.2"/><circle cx="208" cy="348" r="0.9"/><circle cx="247" cy="365" r="1.5"/>
      <circle cx="286" cy="329" r="0.8"/><circle cx="322" cy="399" r="1.1"/><circle cx="365" cy="351" r="1.4"/>
      <circle cx="408" cy="379" r="0.9"/><circle cx="449" cy="331" r="1.2"/><circle cx="487" cy="402" r="0.8"/>
      <circle cx="526" cy="359" r="1.4"/><circle cx="566" cy="383" r="1"/><circle cx="607" cy="326" r="0.9"/>
      <circle cx="648" cy="398" r="1.3"/><circle cx="689" cy="349" r="0.8"/><circle cx="731" cy="376" r="1.5"/>
      <circle cx="772" cy="335" r="0.9"/><circle cx="814" cy="394" r="1.2"/><circle cx="857" cy="356" r="0.8"/>
      <circle cx="899" cy="381" r="1.4"/><circle cx="942" cy="326" r="0.9"/><circle cx="984" cy="401" r="1.1"/>
      <circle cx="1028" cy="348" r="1.5"/><circle cx="1072" cy="374" r="0.8"/><circle cx="1116" cy="337" r="1.2"/>
      <circle cx="1160" cy="392" r="0.9"/><circle cx="1204" cy="353" r="1.3"/><circle cx="1247" cy="382" r="0.8"/>
    </g>
  </g>
  <g fill="#8ff1dd" filter="url(#star-glow)">
    <circle cx="122" cy="112" r="1.1" fill-opacity="0.48"/>
    <circle cx="303" cy="198" r="1.3" fill-opacity="0.52"/>
    <circle cx="521" cy="91" r="0.9" fill-opacity="0.38"/>
    <circle cx="735" cy="162" r="1.1" fill-opacity="0.5"/>
    <circle cx="1008" cy="85" r="1" fill-opacity="0.42"/>
    <circle cx="1147" cy="261" r="1.3" fill-opacity="0.5"/>
    <circle cx="189" cy="603" r="1.2" fill-opacity="0.42"/>
    <circle cx="456" cy="647" r="0.8" fill-opacity="0.36"/>
    <circle cx="847" cy="594" r="1.1" fill-opacity="0.45"/>
    <circle cx="1191" cy="626" r="0.9" fill-opacity="0.4"/>
  </g>
</svg>
